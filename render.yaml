services:
  - type: web
    name: movie-picker
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    disk:
      name: movie-picker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: DATA_DIR
        value: /var/data
      - key: APP_PIN
        sync: false
